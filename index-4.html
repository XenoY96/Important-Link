<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0F5F58">
<title>My Links</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="bar">
    <h1>My Links</h1>
    <button id="refresh" class="refresh" type="button" aria-label="Refresh list">Refresh</button>
  </div>
  <input id="search" class="search" type="search" placeholder="Search links" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Search links">
  <div id="chips" class="chips" role="tablist" aria-label="Categories"></div>
  <p id="status" class="status" role="status" aria-live="polite"></p>
</header>
<main>
  <ul id="list" class="list"></ul>
  <p id="empty" class="empty" hidden></p>
</main>
<script src="app.js"></script>
</body>
</html>
